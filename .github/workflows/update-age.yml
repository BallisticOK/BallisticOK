name: Update profile age

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-age:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Calculate and update age
        shell: bash
        run: |
          python3 <<'PY'
          from datetime import date
          from pathlib import Path
          import re

          birthday = date(2001, 10, 7)
          today = date.today()
          age = today.year - birthday.year - (
              (today.month, today.day) < (birthday.month, birthday.day)
          )

          path = Path("README.md")
          content = path.read_text(encoding="utf-8")
          updated, count = re.subn(
              r"<!-- AGE_START -->\d+<!-- AGE_END -->",
              f"<!-- AGE_START -->{age}<!-- AGE_END -->",
              content,
              count=1,
          )

          if count != 1:
              raise SystemExit("Age markers not found in README.md")

          if updated != content:
              path.write_text(updated, encoding="utf-8")
              print(f"Updated README age to {age}.")
          else:
              print(f"README age is already correct: {age}.")
          PY

      - name: Commit updated README
        run: |
          if git diff --quiet -- README.md; then
            echo "No age update needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: update profile age"
          git push
